<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GetSuitel — Interactive Platform Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;height:100vh;overflow:hidden;color:#fff}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;padding:14px 28px;background:rgba(15,23,42,0.97);border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;gap:20px;z-index:10}
.logo{font-size:18px;font-weight:900;color:#fff;white-space:nowrap}.logo span{color:#C9931A}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.45)}
.crumb .sep{color:rgba(255,255,255,0.2)}
.crumb .cl{cursor:pointer;transition:color .2s}.crumb .cl:hover{color:rgba(255,255,255,.9)}
.crumb .ca{color:rgba(255,255,255,.85)}
.counter{margin-left:auto;font-size:12px;color:rgba(255,255,255,.3);white-space:nowrap}
.main{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px 40px 100px}
.bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(15,23,42,0.97);border-top:1px solid rgba(255,255,255,0.07)}
.pbar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s ease}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:#1e40af;border-color:#1e40af}.btn.pri:hover{background:#1d4ed8}

/* COVER */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 108px);text-align:center;padding:40px 20px}
.badge{display:inline-block;background:rgba(201,147,26,.15);border:1px solid rgba(201,147,26,.35);color:#C9931A;font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px}
.cover h1{font-size:clamp(38px,6vw,70px);font-weight:900;color:#fff;line-height:1.05;margin-bottom:14px}.cover h1 span{color:#C9931A}
.cover-sub{font-size:17px;color:rgba(255,255,255,.55);margin-bottom:36px;max-width:540px;line-height:1.7}
.role-pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:44px}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 14px;font-size:13px;color:rgba(255,255,255,.65)}
.pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.start-btn{background:#1e40af;color:#fff;border:none;padding:15px 44px;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;transition:all .2s}
.start-btn:hover{background:#1d4ed8;transform:translateY(-2px);box-shadow:0 8px 28px rgba(30,64,175,.45)}
.key-hint{margin-top:20px;font-size:12px;color:rgba(255,255,255,.25)}

/* OVERVIEW */
.overview{width:100%;max-width:1080px;padding-top:20px}
.section-title{font-size:30px;font-weight:800;color:#fff;margin-bottom:6px}
.section-sub{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:32px}
.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.rcard{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:24px 20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.rcard:hover{background:rgba(255,255,255,.065);transform:translateY(-3px);border-color:rgba(255,255,255,.12)}
.rcard-top{height:3px;position:absolute;top:0;left:0;right:0}
.rcard-icon{font-size:32px;margin-bottom:14px;margin-top:6px}
.rcard-name{font-size:18px;font-weight:700;color:#fff;margin-bottom:6px}
.rcard-desc{font-size:12px;color:rgba(255,255,255,.4);line-height:1.6;margin-bottom:14px}
.rcard-count{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.rcard-arr{position:absolute;bottom:18px;right:18px;color:rgba(255,255,255,.2);font-size:16px;transition:all .2s}
.rcard:hover .rcard-arr{color:rgba(255,255,255,.7);transform:translateX(3px)}

/* FEATURE LIST */
.fview{width:100%;max-width:1000px;padding-top:10px}
.fheader{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s;display:flex;gap:12px}
.fcard:hover{background:rgba(255,255,255,.07);transform:translateY(-2px);border-color:rgba(255,255,255,.12)}
.fcard-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.fcard-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px}
.fcard-desc{font-size:11px;color:rgba(255,255,255,.4);line-height:1.5;margin-bottom:8px}
.fcard-steps{font-size:11px;font-weight:700}

/* STEP VIEW */
.sview{width:100%;max-width:860px;padding-top:10px}
.sheader{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.stitle{font-size:22px;font-weight:800;color:#fff}
.rtag{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.steps{display:flex;flex-direction:column;gap:0;position:relative}
.steps::before{content:'';position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:rgba(255,255,255,.06);pointer-events:none}
.step{display:flex;gap:18px;padding-bottom:16px;opacity:.2;transition:opacity .45s,transform .45s;transform:translateX(-8px)}
.step.vis{opacity:1;transform:translateX(0)}
.snum{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;z-index:1;transition:background .4s;background:rgba(255,255,255,.07)}
.sbody{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px 18px;transition:all .3s}
.stname{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px}
.stdetail{font-size:13px;color:rgba(255,255,255,.6);line-height:1.65}
.sttag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-top:8px}
.placeholder{font-size:12px;color:rgba(255,255,255,.2);margin-top:6px;font-style:italic}

/* Animations */
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai{animation:fi .35s ease forwards}
.d1{animation-delay:.06s;opacity:0}.d2{animation-delay:.12s;opacity:0}.d3{animation-delay:.18s;opacity:0}
.d4{animation-delay:.24s;opacity:0}.d5{animation-delay:.30s;opacity:0}.d6{animation-delay:.36s;opacity:0}
</style>
</head>
<body>
<div id="app"></div>

let view='cover',roleIdx=null,featIdx=null,revealed=0;
const role=()=>R[roleIdx];
const feat=()=>role()?.features[featIdx];

function render(){
  let crumb='',main='',foot='';
  if(view==='cover'){
    main=coverHtml();
    foot=`<div class="bottombar" style="justify-content:center"><span style="font-size:12px;color:rgba(255,255,255,.3)">Press Space or → to navigate · Click any card to jump in · Esc returns to overview</span></div>`;
  } else if(view==='overview'){
    crumb=bc([{l:'Home',fn:"go('cover')"}],'Platform Overview');
    main=overviewHtml();
    foot=footHtml();
  } else if(view==='role'){
    crumb=bc([{l:'Home',fn:"go('cover')"},{l:'Overview',fn:"go('overview')"}],role().name+' Portal');
    main=roleHtml();
    foot=footHtml();
  } else if(view==='feature'){
    crumb=bc([{l:'Home',fn:"go('cover')"},{l:'Overview',fn:"go('overview')"},{l:role().name,fn:"go('role')"}],feat().name);
    main=featHtml();
    foot=featFootHtml();
  }
  const ctr=view==='feature'?`Step ${Math.min(revealed,feat().steps.length)} / ${feat().steps.length}`:view==='role'?`${role().features.length} features`:view==='overview'?'4 portals':'Interactive Demo';
  document.getElementById('app').innerHTML=`<div class="topbar"><div class="logo">Get<span>Suitel</span></div>${crumb}<div class="counter">${ctr}</div></div><div class="main">${main}</div>${foot}`;
}

function bc(links,cur){
  return `<div class="crumb">${links.map(x=>`<span class="cl" onclick="${x.fn}">${x.l}</span><span class="sep">›</span>`).join('')}<span class="ca">${cur}</span></div>`;
}

function coverHtml(){
  return `<div class="cover">
    <div class="badge ai d1">Interactive Platform Demo</div>
    <h1 class="ai d2">Get<span>Suitel</span><br>Smart Property Management</h1>
    <p class="cover-sub ai d3">End-to-end real estate management for Owners, Tenants, Technicians &amp; Administrators</p>
    <div class="role-pills ai d4">
      ${R.map(r=>`<div class="pill"><div class="dot" style="background:${r.c}"></div>${r.name} Portal — ${r.features.length} Features</div>`).join('')}
    </div>
    <button class="start-btn ai d5" onclick="go('overview')">Explore the Platform &nbsp;→</button>
    <p class="key-hint ai d6">Use ← → arrow keys or Space to navigate</p>
  </div>`;
}

function overviewHtml(){
  return `<div class="overview">
    <div class="section-title ai">Platform Portals</div>
    <div class="section-sub ai d1">Click a portal to explore its features and step-by-step process flows</div>
    <div class="role-grid">
      ${R.map((r,i)=>`<div class="rcard ai d${i+1}" onclick="selRole(${i})">
        <div class="rcard-top" style="background:${r.c}"></div>
        <div class="rcard-icon">${r.icon}</div>
        <div class="rcard-name">${r.name} Portal</div>
        <div class="rcard-desc">${r.id==='owner'?'Property managers and landlords who own and manage real estate assets':r.id==='tenant'?'Residents who rent units and access a portal for payments and communication':r.id==='technician'?'Service technicians who receive and complete maintenance work orders':'GetSuitel platform administrators managing all organizations and subscriptions'}</div>
        <div class="rcard-count" style="background:${r.lc};color:${r.c}">${r.features.length} Features</div>
        <div class="rcard-arr">→</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function roleHtml(){
  const r=role();
  return `<div class="fview">
    <div class="fheader ai">
      <button class="btn" onclick="go('overview')">← Back</button>
      <div>
        <div style="font-size:24px;font-weight:800;color:#fff">${r.icon} ${r.name} Portal</div>
        <div style="font-size:13px;color:rgba(255,255,255,.4);margin-top:3px">Click a feature to see its step-by-step process flow</div>
      </div>
    </div>
    <div class="fgrid">
      ${r.features.map((f,i)=>`<div class="fcard ai d${Math.min(i+1,6)}" onclick="selFeat(${i})">
        <div class="fcard-icon">${f.icon}</div>
        <div>
          <div class="fcard-name">${f.name}</div>
          <div class="fcard-desc">${f.desc}</div>
          <div class="fcard-steps" style="color:${r.c}">${f.steps.length} steps →</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function featHtml(){
  const r=role();const f=feat();
  return `<div class="sview">
    <div class="sheader ai">
      <button class="btn" onclick="go('role')">← Back to ${r.name}</button>
      <div style="flex:1"></div>
      <div class="rtag" style="background:${r.lc};color:${r.c}">${r.icon} ${r.name} Portal</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px" class="ai d1">
      <span style="font-size:28px">${f.icon}</span>
      <span class="stitle">${f.name}</span>
    </div>
    <div class="steps">
      ${f.steps.map((s,i)=>{
        const v=i<revealed,cur=i===revealed-1;
        return `<div class="step${v?' vis':''}" id="st${i}">
          <div class="snum" style="${v?'background:'+r.c:'background:rgba(255,255,255,.07)'}">${v?s.i:i+1}</div>
          <div class="sbody" style="${cur?'border-color:'+r.c+'55;background:'+r.lc:''}">
            <div class="stname">${s.t}</div>
            ${v?`<div class="stdetail">${s.d}</div><span class="sttag" style="background:${r.lc};color:${r.c}">${s.tag}</span>`:`<div class="placeholder">Click "Next Step →" to reveal</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function prog(){
  if(view==='cover')return 0;
  if(view==='overview')return 20;
  if(view==='role')return 50;
  if(view==='feature')return 50+((revealed/(feat()?.steps.length||1))*50);
  return 0;
}

function footHtml(){
  return `<div class="bottombar">
    <button class="btn" onclick="navBack()">← Back</button>
    <div class="pbar"><div class="pfill" style="width:${prog()}%;background:#1e40af"></div></div>
    <button class="btn pri" onclick="navFwd()">Next →</button>
  </div>`;
}

function featFootHtml(){
  const r=role(),steps=feat().steps,done=revealed>=steps.length;
  return `<div class="bottombar">
    <button class="btn" onclick="go('role')">← ${r.name} Features</button>
    <div class="pbar"><div class="pfill" style="width:${prog()}%;background:${r.c}"></div></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:12px;color:rgba(255,255,255,.35)">${revealed}/${steps.length} revealed</span>
      ${done?`<button class="btn" style="background:${r.c};border-color:${r.c}" onclick="go('role')">View More Features →</button>`
            :`<button class="btn" style="background:${r.c};border-color:${r.c};color:#fff" onclick="nxtStep()">Next Step →</button>`}
    </div>
  </div>`;
}

function go(v){view=v;if(v==='overview'||v==='cover'){roleIdx=null;featIdx=null;}if(v==='role')featIdx=null;revealed=0;render();}
function selRole(i){roleIdx=i;featIdx=null;revealed=0;view='role';render();}
function selFeat(i){featIdx=i;revealed=1;view='feature';render();}
function nxtStep(){const s=feat().steps;if(revealed<s.length){revealed++;render();setTimeout(()=>{document.getElementById('st'+(revealed-1))?.scrollIntoView({behavior:'smooth',block:'nearest'});},80);}}
function navBack(){if(view==='overview')go('cover');else if(view==='role')go('overview');else if(view==='feature')go('role');}
function navFwd(){if(view==='cover')go('overview');else if(view==='overview')selRole(0);else if(view==='role')selFeat(0);else nxtStep();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();navFwd();}
  if(e.key==='ArrowLeft'){e.preventDefault();navBack();}
  if(e.key==='Escape'){go('overview');}
});
render();
</script>
</body>
</html>
